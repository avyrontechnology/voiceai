# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceai"
version = "0.10.217"
readme = "README.md"
authors = [
    { name = "Prateek Sachan", email = "ps@prateeksachan.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dynamic = ["dependencies"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pip-tools", "pre-commit", "pytest", "pytest-asyncio", "pytest-cov", "ruff>=0.16,<0.17", "mypy", "bandit"]

[tool.pytest.ini_options]
# Coroutine tests need no @pytest.mark.asyncio decorator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
# B13a gate scope (spec 0004): leaf provider trees are pinned by their dedicated
# offline suites but carry live-network branches no offline run covers — measuring
# them would fail the gate without measuring anything actionable. Everything else
# (session/turn, ports, adapters, common/core/database/agents) stays gated at 85%.
omit = [
    "*/voiceai/modules/voice/io/*",
    "*/voiceai/modules/voice/asr/*",
    "*/voiceai/modules/voice/tts/*",
]

[tool.setuptools]
package-dir = {"voiceai" = "voiceai"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Start minimal, grow over time. Uncomment rules as the codebase is cleaned up.
# Roadmap: F541 → UP → F401 → F841 → I (isort) → E (pycodestyle)
select = [
    "E721",  # type comparison (use isinstance)
    "F811",  # redefined unused name
    "ISC",   # implicit string concatenation bugs
]

# Strict typing applies to the new architecture packages only (AGENTS.md rule 6);
# legacy engine code is excluded until it migrates.
[tool.mypy]
files = ["voiceai/common", "voiceai/core", "voiceai/database", "voiceai/modules", "tests/arch"]
python_version = "3.10"
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Tests are type-CHECKED (spec 0001 pins protocol-conformance annotations) but test defs
# themselves need no annotations; fixtures/parametrize stay ergonomic. tests/ has no
# __init__.py, so mypy resolves these modules under the tests/ root as arch.*.
module = "arch.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
version_files = [
    "voiceai/__init__.py:__version__",
]
update_changelog_on_bump = false
