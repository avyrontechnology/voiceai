# Prod auth gates (fail-closed): set in .env — TELEPHONY_API_KEY (dial 401), CARRIER_VALIDATE_SIGNATURES=1
# (connect 403), TELEPHONY_PUBLIC_URL (trusted sig base). Empty TELEPHONY_API_KEY = localhost-only dial;
# unsigned callbacks = localhost-only unless ALLOW_UNSIGNED_CARRIER_CALLBACK=1 (never in prod).
services:

  voiceai-app:
    container_name: voiceai-app
    build: .
    restart: on-failure
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      # Container DNS: the compose mongo service (localhost would self-resolve).
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: voiceai
    volumes:
      - ./agent_data:/voiceai/agent_data
      # Optional host-only credential share (local dev): missing ~/.aws must not break `compose up`
      # (compose skips absent bind sources only with explicit handling — create empty dirs first).
      # Never mount production secrets this way; use env_file/.env or a secret manager in prod.
      - $HOME/.aws/credentials:/root/.aws/credentials:ro
      - $HOME/.aws/config:/root/.aws/config:ro
    depends_on:
      - redis
      - mongo
    networks:
      - voiceai

  twilio-app:
    container_name: twilio-app
    build: .
    command: uvicorn twilio_api_server:app --host 0.0.0.0 --port 8001 --app-dir local_setup/telephony_server
    restart: on-failure
    ports:
      - "8011:8001"
    env_file:
      - .env
    depends_on:
      - redis
      - voiceai-app
    networks:
      - voiceai

  plivo-app:
    container_name: plivo-app
    build: .
    command: uvicorn plivo_api_server:app --host 0.0.0.0 --port 8002 --app-dir local_setup/telephony_server
    restart: on-failure
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - redis
      - voiceai-app
    networks:
      - voiceai

  talko-app:
    container_name: talko-app
    build: .
    command: uvicorn talko_api_server:app --host 0.0.0.0 --port 8004 --app-dir local_setup/telephony_server
    restart: on-failure
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      - voiceai-app
    networks:
      - voiceai
    # No ngrok needed: Tata streams to talko-service's static PSTN endpoint,
    # which relays media to voiceai-app over the internal network.

  redis:
    container_name: voiceai-redis
    image: redis:latest
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - voiceai

  mongo:
    container_name: voiceai-mongo
    image: mongo:8
    restart: on-failure
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceai

  ngrok:
    container_name: voiceai-ngrok
    image: ngrok/ngrok:latest
    # DETACHED (2026-09-15): excluded from plain `docker compose up` until we
    # decide the tunnel strategy. Re-enable with:
    #   docker compose --profile tunnel up -d ngrok
    # `restart: "no"` so it can never crash-loop unattended (cf. ERR_NGROK_334).
    profiles:
      - tunnel
    restart: "no"
    # NGROK_AUTHTOKEN comes from .env (see .env.sample); never commit the token.
    env_file:
      - .env
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./local_setup/ngrok-config.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"
    networks:
      - voiceai

volumes:
  redisdata:
  mongodata:

networks:
  voiceai:
