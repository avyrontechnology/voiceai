    VectorStoreConfig:
      properties:
        provider:
          type: string
          enum:
          - mongodb
          - lancedb
          title: Provider
          default: mongodb
        connection_string:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection String
        db_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Db Name
        collection_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection Name
        index_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Index Name
        embedding_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Model
        embedding_dimensions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Embedding Dimensions
        vector_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Id
        similarity_top_k:
          type: integer
          title: Similarity Top K
          default: 5
        score_threshold:
          type: number
          title: Score Threshold
          default: 0.1
        reranker_enabled:
          type: boolean
          title: Reranker Enabled
          default: false
        reranker_model_type:
          type: string
          title: Reranker Model Type
          default: minilm-l6-v2
        candidate_count:
          type: integer
          title: Candidate Count
          default: 20
        final_count:
          type: integer
          title: Final Count
          default: 5
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      title: VectorStoreConfig
      description: 'Manual vector-store connection for knowledge/graph agents.


        Persisted per agent in the platform store (never silently dropped).

        `connection_string` holds credentials: GETs return the masked literal,

        PUTs with the masked literal preserve the stored secret (never clobber).'
