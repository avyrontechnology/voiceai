  /batches/{batch_id}/start:
    post:
      tags:
      - Batches
      summary: Start Batch
      description: 'Claim a batch and dial it in the background (202 + poll GET /batches/{id}).


        Compare-and-set DRAFT/SCHEDULED -> RUNNING with Idempotency-Key: replaying
        the same key

        returns the same batch without a second dial pass; a different key while running/terminal

        gets 409. Calling windows (with tz) are enforced here and again inside run_batch.'
      operationId: start_batch_batches__batch_id__start_post
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: delay_scale
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          description: Per-dial delay scale for simulated batches (0 = instant).
          default: 0.0
          title: Delay Scale
        description: Per-dial delay scale for simulated batches (0 = instant).
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '422':
          description: Validation Error
          content:
