    CreateBatchRequest:
      properties:
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
        name:
          type: string
          minLength: 1
          title: Name
        entries:
          items:
            $ref: '#/components/schemas/BatchEntry'
          type: array
          maxItems: 100
          minItems: 1
          title: Entries
        schedule_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Schedule At
        calling_hours:
          anyOf:
          - $ref: '#/components/schemas/CallingHours'
          - type: 'null'
        delay_scale:
          type: number
          minimum: 0.0
          title: Delay Scale
          default: 0.5
        provider:
          type: string
          enum:
          - simulated
          - talko
          title: Provider
          description: '''talko'' dials each entry for real via the Talko trunk (Tata
            Tele); anything else simulates.'
          default: simulated
        from_number:
          anyOf:
          - type: string
          - type: 'null'
          title: From Number
          description: Caller DID override for talko-dialed batches (defaults to trunk
            TALKO_AI_DID).
        talko_api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Talko Api Key
          description: Write-only per-batch Talko key. Accepted on create, held ephemerally
            for the dial (request-scoped store), never persisted readable nor serialized
            back. Omit to use trunk TALKO_API_KEY env.
      type: object
      required:
      - agent_id
      - name
      - entries
      title: CreateBatchRequest
      description: 'Create a dial batch (max 100 entries).


        Start is asynchronous: POST /batches/{id}/start claims the batch (compare-and-set

        DRAFT/SCHEDULED -> RUNNING, Idempotency-Key supported) and returns 202 with
        RUNNING;

        poll GET /batches/{id} (or /batches/{id}/status) until completed/stopped.
        Talko dials

        stay IN_PROGRESS (batch pending, media outcome in Talko CDR) while simulated
        dials end

        COMPLETED/FAILED. Dials never debit the wallet (topup-only decorative balance).'
