          description: Reasoning effort configuration for reasoning models (e.g.,
            o1).
        verbosity:
          anyOf:
          - $ref: '#/components/schemas/Verbosity'
          - type: 'null'
          description: Verbosity level of the LLM responses.
        use_responses_api:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Responses Api
          description: Whether to use a specific responses API.
          default: false
        compact_threshold:
          anyOf:
          - type: integer
          - type: 'null'
          title: Compact Threshold
          description: Threshold for compacting message history context.
        agent_flow_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Flow Type
          default: streaming
        extraction_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Extraction Details
        summarization_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Summarization Details
      type: object
      title: SimpleLlmAgent
    SmallestConfig:
      properties:
        voice_id:
          type: string
          title: Voice Id
        language:
          type: string
          title: Language
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
      type: object
      required:
      - voice_id
      - language
      - voice
      - model
      title: SmallestConfig
    Synthesizer:
      properties:
        provider:
          type: string
          title: Provider
          description: The text-to-speech provider to use (e.g., 'elevenlabs', 'polly',
            'deepgram').
        provider_config:
          anyOf:
          - $ref: '#/components/schemas/PollyConfig'
          - $ref: '#/components/schemas/ElevenLabsConfig'
          - $ref: '#/components/schemas/AzureConfig'
          - $ref: '#/components/schemas/RimeConfig'
          - $ref: '#/components/schemas/SmallestConfig'
          - $ref: '#/components/schemas/SarvamConfig'
          - $ref: '#/components/schemas/PixaConfig'
          - $ref: '#/components/schemas/CartesiaConfig'
          - $ref: '#/components/schemas/DeepgramConfig'
          - $ref: '#/components/schemas/OpenAIConfig'
          - $ref: '#/components/schemas/MayaConfig'
          - $ref: '#/components/schemas/KalpaConfig'
          title: Provider Config
          description: Provider-specific configuration details.
        stream:
          type: boolean
          title: Stream
          description: Whether to stream synthesized audio back to the client.
          default: false
        buffer_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buffer Size
          description: Buffer size in characters before sending text to the synthesizer.
          default: 40
        audio_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Format
          description: Audio format for the synthesized output.
          default: pcm
        caching:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Caching
          description: Enable caching of frequently synthesized phrases.
          default: true
      type: object
      required:
      - provider
      - provider_config
      title: Synthesizer
    Task:
      properties:
        tools_config:
          $ref: '#/components/schemas/ToolsConfig'
          description: Configuration mapping for tools, STT, TTS, and the LLM agent
            used in this task.
        toolchain:
          $ref: '#/components/schemas/ToolsChainModel'
          description: Execution pipeline and chain for the tasks (e.g., parallel
            vs sequential).
        task_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Type
          description: Type of the task. E.g., 'conversation', 'extraction', 'summarization'.
          default: conversation
        task_config:
          $ref: '#/components/schemas/ConversationConfig'
          description: Conversation settings, including latency optimizations and
            termination logic.
      type: object
      required:
      - tools_config
      - toolchain
      title: Task
    ToolDescription:
      properties:
        type:
          type: string
          title: Type
          description: The type of the tool (usually 'function').
          default: function
        function:
          $ref: '#/components/schemas/ToolFunction'
          description: The definition of the function.
      type: object
      required:
      - function
      title: ToolDescription
    ToolDescriptionLegacy:
      properties:
        name:
          type: string
          title: Name
          description: The name of the tool function.
        description:
          type: string
          title: Description
          description: A description of what the tool does.
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: JSON Schema defining the expected parameters.
      type: object
      required:
      - name
      - description
      - parameters
      title: ToolDescriptionLegacy
    ToolFunction:
      properties:
        name:
          type: string
          title: Name
          description: The name of the tool function.
        description:
          type: string
          title: Description
          description: A description of what the tool does.
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: JSON Schema defining the expected parameters.
        strict:
          type: boolean
          title: Strict
          description: Whether to strictly enforce the parameter schema.
          default: true
      type: object
      required:
      - name
      - description
      - parameters
      title: ToolFunction
    ToolModel:
      properties:
        tools:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/ToolDescription'
              - $ref: '#/components/schemas/ToolDescriptionLegacy'
            type: array
          - type: 'null'
          title: Tools
          description: List of tool definitions or a string reference to tools.
        tools_params:
          additionalProperties:
            $ref: '#/components/schemas/APIParams'
          type: object
          title: Tools Params
          description: Configuration mapping for API endpoints these tools might call.
      type: object
      required:
      - tools_params
      title: ToolModel
    ToolScope:
      type: string
      enum:
      - global
      - node
      title: ToolScope
      description: 'Where a graph-agent tool is exposed: GLOBAL (every node) or NODE
        (only its listed nodes).'
    ToolsChainModel:
      properties:
        execution:
          type: string
          pattern: ^(parallel|sequential)$
          title: Execution
          description: 'Execution mode: ''parallel'' or ''sequential''.'
        pipelines:
          items:
            items:
              type: string
            type: array
          type: array
          title: Pipelines
          description: A list of lists, where each sublist is a pipeline of tool names
            to execute.
      type: object
      required:
      - execution
      - pipelines
      title: ToolsChainModel
    ToolsConfig:
      properties:
        llm_agent:
          anyOf:
          - $ref: '#/components/schemas/LlmAgent'
          - $ref: '#/components/schemas/SimpleLlmAgent'
          - type: 'null'
          title: Llm Agent
          description: Configuration for the LLM agent responsible for understanding
            and responding to user intent.
        synthesizer:
          anyOf:
          - $ref: '#/components/schemas/Synthesizer'
          - type: 'null'
          description: Configuration for the Text-To-Speech (TTS) synthesizer.
        transcriber:
          anyOf:
          - $ref: '#/components/schemas/Transcriber'
          - type: 'null'
          description: Configuration for the Speech-To-Text (STT) transcriber.
        input:
          anyOf:
          - $ref: '#/components/schemas/IOModel'
          - type: 'null'
          description: Configuration for processing incoming audio streams.
        output:
          anyOf:
          - $ref: '#/components/schemas/IOModel'
          - type: 'null'
          description: Configuration for processing outgoing audio streams.
        api_tools:
          anyOf:
          - $ref: '#/components/schemas/ToolModel'
          - type: 'null'
          description: External API tools that the LLM agent can call during the conversation.
        s2s:
          anyOf:
          - $ref: '#/components/schemas/S2SConfig'
          - type: 'null'
          description: Configuration for server-to-server (S2S) multimodal audio providers
            (like OpenAI Realtime).
        switch_tool_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Switch Tool Description
          description: Description used when handing off to another agent in a multi-agent
            scenario.
        switch_handoff_messages:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Switch Handoff Messages
          description: Messages played to the user during agent handoffs, mapped by
            language/intent.
        agent_names:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Agent Names
          description: Mapping of agent names for multi-agent dispatching.
      type: object
      title: ToolsConfig
    Transcriber:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: The transcriber model to use.
          default: nova-2
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Language code for transcription (e.g., 'en', 'es').
        stream:
          type: boolean
          title: Stream
          description: Whether to stream audio data to the transcriber.
          default: false
        sampling_rate:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sampling Rate
          description: Audio sampling rate in Hz.
          default: 16000
        encoding:
          anyOf:
          - type: string
          - type: 'null'
          title: Encoding
          description: Audio encoding format.
          default: linear16
        endpointing:
          anyOf:
          - type: integer
          - type: 'null'
          title: Endpointing
          description: Duration of silence in ms to trigger endpointing (utterance
            completion).
          default: 500
        keywords:
          anyOf:
          - type: string
          - type: 'null'
          title: Keywords
          description: Comma-separated keywords to boost transcription accuracy.
        task:
          anyOf:
          - type: string
          - type: 'null'
          title: Task
          description: Task type, usually 'transcribe'.
          default: transcribe
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
          description: The speech-to-text provider to use.
          default: deepgram
        multilingual:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Multilingual
          description: Multilingual configuration settings.
        active:
          anyOf:
          - type: string
          - type: 'null'
          title: Active
          description: Active status identifier.
        eot_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Eot Threshold
          description: End-of-turn threshold for flux models.
        eager_eot_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Eager Eot Threshold
          description: Eager end-of-turn threshold.
        eot_timeout_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Eot Timeout Ms
          description: End-of-turn timeout in milliseconds.
        language_hints:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Language Hints
          description: List of probable languages to hint the transcriber.
        delay:
          anyOf:
          - type: string
          - type: 'null'
          title: Delay
          description: Delay configuration ('low', 'medium', 'high').
          default: medium
        noise_reduction:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Noise Reduction
          description: Whether to apply noise reduction to the incoming audio.
          default: false
        vad_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Vad Threshold
          description: Voice Activity Detection (VAD) confidence threshold.
          default: 0.5
        vad_prefix_padding_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vad Prefix Padding Ms
          description: Padding in milliseconds applied before VAD triggers.
          default: 300
      type: object
      title: Transcriber
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VectorStore:
      properties:
        provider:
          type: string
          title: Provider
        provider_config:
          anyOf:
          - $ref: '#/components/schemas/LanceDBProviderConfig'
          - $ref: '#/components/schemas/MongoDBProviderConfig'
          title: Provider Config
      type: object
      required:
      - provider
      - provider_config
      title: VectorStore
    Verbosity:
      type: string
      enum:
      - low
      - medium
      - high
      title: Verbosity
    CallDetails:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The ID of the agent to handle the call.
        recipient_phone_number:
          type: string
          title: Recipient Phone Number
          description: The phone number to call in E.164 format (e.g., +1234567890).
      type: object
      required:
      - agent_id
      - recipient_phone_number
      title: CallDetails
