openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /agent/{agent_id}:
    get:
      tags:
      - Agents
      summary: Get Agent Configuration
      description: Fetches an agent's complete configuration by its unique ID.
      operationId: get_agent_agent__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Agent configuration successfully retrieved.
          content:
            application/json:
              schema: {}
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Agents
      summary: Update Existing Agent
      description: Overwrites an existing agent's configuration. Recalculates extraction
        prompts if needed.
      operationId: edit_agent_agent__agent_id__put
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdatedResponse'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agents
      summary: Delete Agent
      description: Removes an agent's configuration from the system by ID.
      operationId: delete_agent_agent__agent_id__delete
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeletedResponse'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent:
    post:
      tags:
      - Agents
      summary: Create New Agent
      description: Creates a new agent configuration, generates an ID, and stores
        it in Redis. If extraction tasks are present, it will automatically generate
        extraction prompts.
      operationId: create_agent_agent_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCreatedResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /all:
    get:
      tags:
      - Agents
      summary: List All Agents
      description: Fetches all agents and their configurations currently stored in
        Redis.
      operationId: get_all_agents_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /twilio/call:
    post:
      tags:
      - Twilio Telephony
      summary: Initiate Outbound Call (Twilio)
      description: Initiates an outbound call using Twilio to the specified recipient
        phone number and connects it to the specified agent.
      operationId: make_call_call_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallDetails'
        required: true
      responses:
        '200':
          description: Call initiated successfully.
          content:
            application/json:
              schema: {}
        '404':
          description: Agent or recipient phone number not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /twilio/twilio_connect:
    post:
      tags:
      - Twilio Telephony
      summary: Twilio TwiML Connect Callback
      description: Callback endpoint for Twilio to provide TwiML instructions for
        streaming audio to the VoiceAI WebSocket server.
      operationId: twilio_connect_twilio_connect_post
      parameters:
      - name: voiceai_host
        in: query
        required: true
        schema:
          type: string
          description: The public URL of the VoiceAI websocket host
          title: Voiceai Host
        description: The public URL of the VoiceAI websocket host
      - name: agent_id
        in: query
        required: true
        schema:
          type: string
          description: The ID of the agent to connect
          title: Agent Id
        description: The ID of the agent to connect
      responses:
        '200':
          description: TwiML instructions returned successfully.
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plivo/call:
    post:
      tags:
      - Plivo Telephony
      summary: Initiate Outbound Call (Plivo)
      description: Initiates an outbound call using Plivo to the specified recipient
        phone number and connects it to the specified agent.
      operationId: make_call_call_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallDetails'
        required: true
      responses:
        '200':
          description: Call initiated successfully.
          content:
            application/json:
              schema: {}
        '404':
          description: Agent or recipient phone number not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plivo/plivo_connect:
    post:
      tags:
      - Plivo Telephony
      summary: Plivo Answer URL Callback
      description: Callback endpoint for Plivo to provide XML instructions for streaming
        audio to the VoiceAI WebSocket server.
      operationId: plivo_connect_plivo_connect_post
      parameters:
      - name: voiceai_host
        in: query
        required: true
        schema:
          type: string
          description: The public URL of the VoiceAI websocket host
          title: Voiceai Host
        description: The public URL of the VoiceAI websocket host
      - name: agent_id
        in: query
        required: true
        schema:
          type: string
          description: The ID of the agent to connect
          title: Agent Id
        description: The ID of the agent to connect
      responses:
        '200':
          description: XML instructions returned successfully.
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plivo/plivo_hangup_callback:
    post:
      summary: Plivo Hangup Callback
      operationId: plivo_hangup_callback_plivo_hangup_callback_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    APIParams:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
          default: POST
        api_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Token
        param:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Param
        headers:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Headers
        pre_call_message:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pre Call Message
        pre_call_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Pre Call Webhook Url
        pre_call_webhook_param:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pre Call Webhook Param
        scope:
          anyOf:
          - $ref: '#/components/schemas/ToolScope'
          - type: 'null'
        nodes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Nodes
      type: object
      title: APIParams
    AgentCreatedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the created agent.
        state:
          type: string
          title: State
          description: State of the agent creation.
          default: created
      type: object
      required:
      - agent_id
      title: AgentCreatedResponse
    AgentDeletedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the deleted agent.
        state:
          type: string
          title: State
          description: State of the agent deletion.
          default: deleted
      type: object
      required:
      - agent_id
      title: AgentDeletedResponse
    AgentListItem:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The ID of the agent.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: The agent configuration data.
      type: object
      required:
      - agent_id
      - data
      title: AgentListItem
    AgentListResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentListItem'
          type: array
          title: Agents
          description: List of all available agents.
      type: object
      required:
      - agents
      title: AgentListResponse
    AgentModel:
      properties:
        agent_name:
          type: string
          title: Agent Name
          description: A recognizable name for this agent.
        agent_type:
          type: string
          title: Agent Type
          description: Type of agent architecture. E.g., 'other', 'graph_agent', 'llm_agent'.
          default: other
        tasks:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Tasks
          description: List of tasks to execute in order. Can include conversations,
            extractions, etc.
        agent_welcome_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Welcome Message
          description: First message spoken by the agent upon connecting the call.
          default: This call is being recorded for quality assurance and training.
            Please speak now.
      type: object
      required:
      - agent_name
      - tasks
      title: AgentModel
    AgentRouteConfig:
      properties:
        utterances:
          items:
            type: string
          type: array
          title: Utterances
          description: Example utterances that should route to this agent.
        threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold
          description: Confidence threshold required to route.
          default: 0.85
      type: object
      required:
      - utterances
      title: AgentRouteConfig
    AgentUpdatedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the updated agent.
        state:
          type: string
          title: State
          description: State of the agent update.
          default: updated
      type: object
      required:
      - agent_id
      title: AgentUpdatedResponse
    AzureConfig:
      properties:
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
        language:
          type: string
          title: Language
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          default: 1.0
      type: object
      required:
      - voice
      - model
      - language
      title: AzureConfig
    CartesiaConfig:
      properties:
        voice_id:
          type: string
          title: Voice Id
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
        language:
          type: string
          title: Language
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          default: 1.0
      type: object
      required:
      - voice_id
      - voice
      - model
      - language
      title: CartesiaConfig
    ConversationConfig:
      properties:
        optimize_latency:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Optimize Latency
          description: Whether to aggressively optimize for lower latency across the
            pipeline.
          default: true
        hangup_after_silence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hangup After Silence
          description: Time in seconds of silence before the system automatically
            hangs up the call.
          default: 20
        incremental_delay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Incremental Delay
          description: Incremental delay in milliseconds used to handle long pauses
            in conversation.
          default: 900
        number_of_words_for_interruption:
          anyOf:
          - type: integer
          - type: 'null'
          title: Number Of Words For Interruption
          description: Minimum number of words detected before triggering a barge-in/interruption.
          default: 1
        interruption_backoff_period:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interruption Backoff Period
          description: Time in milliseconds to ignore further audio immediately after
            an interruption.
          default: 100
        hangup_after_LLMCall:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hangup After Llmcall
          description: Whether to automatically hang up after the LLM agent completes
            its primary goal.
          default: false
        call_cancellation_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Cancellation Prompt
          description: Prompt/instruction used to detect if the user wants to cancel
            or end the call.
        backchanneling:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Backchanneling
          description: Enable active listening/backchanneling (e.g., saying 'mm-hmm'
            while the user speaks).
          default: false
        backchanneling_message_gap:
          anyOf:
          - type: integer
          - type: 'null'
          title: Backchanneling Message Gap
          description: Minimum gap in seconds between consecutive backchanneling messages.
          default: 5
        backchanneling_start_delay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Backchanneling Start Delay
          description: Delay in seconds before initiating backchanneling behavior.
          default: 5
        ambient_noise:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ambient Noise
          description: Whether to play synthetic ambient noise in the background.
          default: false
        call_terminate:
          anyOf:
          - type: integer
          - type: 'null'
          title: Call Terminate
          description: Maximum total call duration in seconds before forced termination.
          default: 90
        use_fillers:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Fillers
          description: Whether to use filler words ('uh', 'um') before LLM responses
            to reduce perceived latency.
          default: false
        trigger_user_online_message_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trigger User Online Message After
          description: Time in seconds of inactivity before prompting the user to
            see if they are still there.
          default: 10
        check_user_online_message:
          anyOf:
          - type: string
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Check User Online Message
          description: The message played when checking if the user is still online.
          default: Hey, are you still there
        check_if_user_online:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Check If User Online
          description: Enable proactive checks to see if the user is still on the
            line.
          default: true
        dtmf_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Dtmf Enabled
          description: Whether to enable processing of DTMF (keypad) tones.
          default: false
        voicemail:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Voicemail
          description: Whether to enable voicemail detection.
          default: false
        voicemail_detection_duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Voicemail Detection Duration
          description: Time window in seconds to detect voicemail signals.
          default: 30.0
        voicemail_check_interval:
          anyOf:
          - type: number
          - type: 'null'
          title: Voicemail Check Interval
          description: Minimum time in seconds between interim voicemail checks.
          default: 7.0
        voicemail_min_transcript_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Voicemail Min Transcript Length
          description: Minimum number of transcribed words to trigger an interim voicemail
            check.
          default: 7
      type: object
      title: ConversationConfig
    CreateAgentPayload:
      properties:
        agent_config:
          $ref: '#/components/schemas/AgentModel'
          description: The main agent configuration including tools, tasks, and settings.
        agent_prompts:
          anyOf:
          - additionalProperties:
              additionalProperties:
                type: string
              type: object
            type: object
          - type: 'null'
          title: Agent Prompts
          description: Optional prompts mapped by intent/context.
      type: object
      required:
      - agent_config
      title: CreateAgentPayload
    DeepgramConfig:
      properties:
        voice_id:
          type: string
          title: Voice Id
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
      type: object
      required:
      - voice_id
      - voice
      - model
      title: DeepgramConfig
    Edge:
      properties:
        start_node:
          type: string
          title: Start Node
        end_node:
          type: string
          title: End Node
        condition:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Condition
      type: object
      required:
      - start_node
      - end_node
      title: Edge
    EdgeConditionType:
      type: string
      enum:
      - llm
      - expression
      - unconditional
      - event
      title: EdgeConditionType
    ElevenLabsConfig:
      properties:
        voice:
          type: string
          title: Voice
        voice_id:
          type: string
          title: Voice Id
        model:
          type: string
          title: Model
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          default: 0.5
        similarity_boost:
          anyOf:
          - type: number
          - type: 'null'
          title: Similarity Boost
          default: 0.75
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          default: 1.0
        style:
          anyOf:
          - type: number
          - type: 'null'
          title: Style
          default: 0.0
      type: object
      required:
      - voice
      - voice_id
      - model
      title: ElevenLabsConfig
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Error description message.
      type: object
      required:
      - detail
      title: ErrorResponse
    ExpressionCondition:
      properties:
        variable:
          type: string
          title: Variable
          description: Dot-notation key, e.g. 'detected_language' or 'recipient_data.timezone'
        operator:
          $ref: '#/components/schemas/ExpressionOperator'
          description: The operator to apply for the condition.
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
          description: The value to compare against.
      type: object
      required:
      - variable
      - operator
      title: ExpressionCondition
    ExpressionGroup:
      properties:
        logic:
          $ref: '#/components/schemas/ExpressionLogic'
          description: Logical operator (AND/OR) to combine multiple conditions.
          default: and
        conditions:
          items:
            $ref: '#/components/schemas/ExpressionCondition'
          type: array
          title: Conditions
          description: List of conditions to evaluate.
      type: object
      title: ExpressionGroup
    ExpressionLogic:
      type: string
      enum:
      - and
      - or
      title: ExpressionLogic
    ExpressionOperator:
      type: string
      enum:
      - eq
      - neq
      - gt
      - gte
      - lt
      - lte
      - in
      - not_in
      - contains
      - exists
      - not_exists
      title: ExpressionOperator
    GeminiLiveConfig:
      properties:
        model:
          type: string
          title: Model
          description: The Gemini Live model ID to use.
          default: gemini-3.1-flash-live-preview
        voice:
          type: string
          title: Voice
          description: The default voice to use.
          default: Kore
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Language setting.
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: Temperature for generation.
        start_sensitivity:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Sensitivity
          description: Voice activation start sensitivity.
        end_sensitivity:
          anyOf:
          - type: string
          - type: 'null'
          title: End Sensitivity
          description: Voice activation end sensitivity.
        vad_silence_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vad Silence Duration Ms
          description: VAD silence duration in ms.
          default: 600
        vad_prefix_padding_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vad Prefix Padding Ms
          description: Prefix padding for VAD.
        enable_session_resumption:
          type: boolean
          title: Enable Session Resumption
          description: Whether to resume the session gracefully if it closes automatically.
          default: true
        enable_context_compression:
          type: boolean
          title: Enable Context Compression
          description: Whether to compress context to save tokens over long sessions.
          default: true
      type: object
      title: GeminiLiveConfig
    GraphEdge:
      properties:
        to_node_id:
          type: string
          title: To Node Id
          description: Target node ID to transition to.
        condition:
          type: string
          title: Condition
          description: Human-readable description of when to transition.
          default: ''
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: Optional label for the edge.
        condition_type:
          anyOf:
          - $ref: '#/components/schemas/EdgeConditionType'
          - type: 'null'
          description: Type of condition triggering the transition. None maps to 'llm'.
        expression:
          anyOf:
          - $ref: '#/components/schemas/ExpressionGroup'
          - type: 'null'
          description: Expression to evaluate if condition_type is 'expression'.
        event_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Name
          description: Event name to match if condition_type is 'event'.
        function_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Function Name
          description: Name of the function the LLM must call to transition, e.g.
            'go_to_city_question'.
        function_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Function Description
          description: Detailed description of the transition function for the LLM.
        parameters:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Parameters
          description: Optional parameters to collect during transition, mapping names
            to types.
        priority:
          anyOf:
          - type: integer
          - type: 'null'
          title: Priority
          description: Evaluation priority within the same condition type tier. Lower
            is evaluated first.
      type: object
      required:
      - to_node_id
      title: GraphEdge
      description: 'Edge definition for graph-based conversation flow.


        Each edge represents a possible transition from the current node.

