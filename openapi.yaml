components:
  schemas:
    APIParams:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
          default: POST
        api_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Token
        param:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Param
        headers:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Headers
        pre_call_message:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pre Call Message
        pre_call_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Pre Call Webhook Url
        pre_call_webhook_param:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pre Call Webhook Param
        scope:
          anyOf:
          - $ref: '#/components/schemas/ToolScope'
          - type: 'null'
        nodes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Nodes
      type: object
      title: APIParams
    AcceptInviteRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
      type: object
      required:
      - token
      - password
      title: AcceptInviteRequest
    AddMemberRequest:
      properties:
        email:
          type: string
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          - viewer
          title: Role
          default: member
      type: object
      required:
      - email
      title: AddMemberRequest
    AgentCreatedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the created agent.
        state:
          type: string
          title: State
          description: State of the agent creation.
          default: created
      type: object
      required:
      - agent_id
      title: AgentCreatedResponse
    AgentDeletedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the deleted agent.
        state:
          type: string
          title: State
          description: State of the agent deletion.
          default: deleted
      type: object
      required:
      - agent_id
      title: AgentDeletedResponse
    AgentListItem:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The ID of the agent.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: The agent configuration data.
      type: object
      required:
      - agent_id
      - data
      title: AgentListItem
    AgentListResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentListItem'
          type: array
          title: Agents
          description: List of all available agents.
      type: object
      required:
      - agents
      title: AgentListResponse
    AgentModel:
      properties:
        agent_name:
          type: string
          title: Agent Name
          description: A recognizable name for this agent.
        agent_type:
          type: string
          title: Agent Type
          description: Type of agent architecture. E.g., 'other', 'graph_agent', 'llm_agent'.
          default: other
        tasks:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Tasks
          description: List of tasks to execute in order. Can include conversations,
            extractions, etc.
        agent_welcome_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Welcome Message
          description: First message spoken by the agent upon connecting the call.
          default: This call is being recorded for quality assurance and training.
            Please speak now.
      type: object
      required:
      - agent_name
      - tasks
      title: AgentModel
    AgentPromptsResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the agent.
        agent_prompts:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Agent Prompts
          description: Stored prompts mapped by task (e.g. task_1), or null when none
            were saved.
      type: object
      required:
      - agent_id
      title: AgentPromptsResponse
    AgentRouteConfig:
      properties:
        utterances:
          items:
            type: string
          type: array
          title: Utterances
          description: Example utterances that should route to this agent.
        threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold
          description: Confidence threshold required to route.
          default: 0.85
      type: object
      required:
      - utterances
      title: AgentRouteConfig
    AgentUpdatedResponse:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: The unique identifier for the updated agent.
        state:
          type: string
          title: State
          description: State of the agent update.
          default: updated
      type: object
      required:
      - agent_id
      title: AgentUpdatedResponse
    ApiKey:
      properties:
        key_id:
          type: string
          title: Key Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        key_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Hash
          description: SHA-256 of secret; never exposed via API.
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
      type: object
      required:
      - key_id
      - name
      - prefix
      title: ApiKey
    ApiKeyListResponse:
      properties:
        api_keys:
          items:
            $ref: '#/components/schemas/ApiKey'
          type: array
          title: Api Keys
      type: object
      required:
      - api_keys
      title: ApiKeyListResponse
    AssignNumberRequest:
      properties:
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
      type: object
      required:
      - agent_id
      title: AssignNumberRequest
    AttachKBRequest:
      properties:
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
      type: object
      required:
      - agent_id
      title: AttachKBRequest
    AuthEvent:
      properties:
        event_id:
          type: string
          title: Event Id
        type:
          type: string
          title: Type
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - event_id
      - type
      title: AuthEvent
    AuthEventListResponse:
      properties:
        events:
          items:
            $ref: '#/components/schemas/AuthEvent'
          type: array
          title: Events
      type: object
      required:
      - events
      title: AuthEventListResponse
    AuthMeResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        scopes:
          items:
            type: string
          type: array
          title: Scopes
      type: object
      required:
      - user
      title: AuthMeResponse
    AzureConfig:
      properties:
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
        language:
          type: string
          title: Language
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          default: 1.0
      type: object
      required:
      - voice
      - model
      - language
      title: AzureConfig
    Batch:
      properties:
        batch_id:
          type: string
          title: Batch Id
        agent_id:
          type: string
          title: Agent Id
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/BatchStatus'
          default: draft
        entries:
          items:
            $ref: '#/components/schemas/BatchEntry'
          type: array
          title: Entries
        stats:
          $ref: '#/components/schemas/BatchStats'
        schedule_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Schedule At
        calling_hours:
          anyOf:
          - $ref: '#/components/schemas/CallingHours'
          - type: 'null'
        provider:
          type: string
          enum:
          - simulated
          - talko
          title: Provider
          default: simulated
        from_number:
          anyOf:
          - type: string
          - type: 'null'
          title: From Number
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
          description: Last Idempotency-Key that claimed the start (CAS guard).
        org_id:
          type: string
          title: Org Id
          description: Owning org; lists/gets are scoped to the caller org.
          default: default
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
      type: object
      required:
      - batch_id
      - agent_id
      - name
      title: Batch
      description: 'A dial batch. Lifecycle: DRAFT/SCHEDULED -> RUNNING -> COMPLETED/STOPPED.


        Start uses compare-and-set (only DRAFT/SCHEDULED may move to RUNNING) with
        an optional

        Idempotency-Key: replaying the same key returns the same batch without a second
        dial pass.

        Stop sets STOPPED; run_batch checks the flag before every entry and cancels
        in-flight

        trunk HTTP so pending dials never start. Talko-accepted entries count as `stats.pending`

        (execution IN_PROGRESS, completion arrives via Talko CDR callback — not yet
        wired, see

        talko_dialer) rather than `stats.completed`.'
    BatchEntry:
      properties:
        to_number:
          type: string
          minLength: 1
          title: To Number
        variables:
          additionalProperties: true
          type: object
          title: Variables
      type: object
      required:
      - to_number
      title: BatchEntry
    BatchListResponse:
      properties:
        batches:
          items:
            $ref: '#/components/schemas/Batch'
          type: array
          title: Batches
      type: object
      required:
      - batches
      title: BatchListResponse
    BatchStats:
      properties:
        total:
          type: integer
          title: Total
          default: 0
        queued:
          type: integer
          title: Queued
          default: 0
        completed:
          type: integer
          title: Completed
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        pending:
          type: integer
          title: Pending
          description: Talko-accepted dials awaiting CDR (execution IN_PROGRESS, media
            outcome in Talko).
          default: 0
      type: object
      title: BatchStats
    BatchStatus:
      type: string
      enum:
      - draft
      - scheduled
      - running
      - paused
      - completed
      - stopped
      title: BatchStatus
    CallingHours:
      properties:
        start:
          type: string
          pattern: ^\d{2}:\d{2}$
          title: Start
        end:
          type: string
          pattern: ^\d{2}:\d{2}$
          title: End
        tz:
          type: string
          title: Tz
          description: IANA timezone for the window, e.g. "Asia/Kolkata".
          default: UTC
      type: object
      required:
      - start
      - end
      title: CallingHours
      description: 'Daily calling window in 24h HH:MM. start == end means closed all
        day.


        `tz` is an IANA zone (e.g. "Asia/Kolkata", "UTC"). The window is evaluated
        in that zone;

        UTC is the default so bare "09:00-18:00" keeps its historical meaning. run_batch
        and

        run_campaign enforce the window themselves (not only the HTTP start route).'
    CampaignEntry:
      properties:
        to_number:
          type: string
          minLength: 1
          title: To Number
        variables:
          additionalProperties: true
          type: object
          title: Variables
      type: object
      required:
      - to_number
      title: CampaignEntry
    CartesiaConfig:
      properties:
        voice_id:
          type: string
          title: Voice Id
        voice:
          type: string
          title: Voice
        model:
          type: string
          title: Model
        language:
          type: string
          title: Language
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          default: 1.0
      type: object
      required:
      - voice_id
      - voice
      - model
      - language
      title: CartesiaConfig
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          maxLength: 128
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 128
          minLength: 8
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
    ConversationConfig:
      properties:
        optimize_latency:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Optimize Latency
          description: Whether to aggressively optimize for lower latency across the
            pipeline.
          default: true
        hangup_after_silence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hangup After Silence
          description: Time in seconds of silence before the system automatically
            hangs up the call.
          default: 20
        incremental_delay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Incremental Delay
          description: Incremental delay in milliseconds used to handle long pauses
            in conversation.
          default: 900
        number_of_words_for_interruption:
          anyOf:
          - type: integer
          - type: 'null'
          title: Number Of Words For Interruption
          description: Minimum number of words detected before triggering a barge-in/interruption.
          default: 1
        interruption_backoff_period:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interruption Backoff Period
          description: Time in milliseconds to ignore further audio immediately after
            an interruption.
          default: 100
        hangup_after_LLMCall:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hangup After Llmcall
          description: Whether to automatically hang up after the LLM agent completes
            its primary goal.
          default: false
        call_cancellation_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Cancellation Prompt
          description: Prompt/instruction used to detect if the user wants to cancel
            or end the call.
        backchanneling:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Backchanneling
          description: Enable active listening/backchanneling (e.g., saying 'mm-hmm'
            while the user speaks).
          default: false
        backchanneling_message_gap:
          anyOf:
          - type: integer
          - type: 'null'
          title: Backchanneling Message Gap
          description: Minimum gap in seconds between consecutive backchanneling messages.
          default: 5
        backchanneling_start_delay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Backchanneling Start Delay
          description: Delay in seconds before initiating backchanneling behavior.
          default: 5
        ambient_noise:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ambient Noise
          description: Whether to play synthetic ambient noise in the background.
          default: false
        call_terminate:
          anyOf:
          - type: integer
          - type: 'null'
          title: Call Terminate
          description: Maximum total call duration in seconds before forced termination.
          default: 90
        use_fillers:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Fillers
          description: Whether to use filler words ('uh', 'um') before LLM responses
            to reduce perceived latency.
          default: false
        trigger_user_online_message_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trigger User Online Message After
          description: Time in seconds of inactivity before prompting the user to
            see if they are still there.
          default: 10
        check_user_online_message:
          anyOf:
          - type: string
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Check User Online Message
          description: The message played when checking if the user is still online.
          default: Hey, are you still there
        check_if_user_online:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Check If User Online
          description: Enable proactive checks to see if the user is still on the
            line.
          default: true
        dtmf_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Dtmf Enabled
          description: Whether to enable processing of DTMF (keypad) tones.
          default: false
        voicemail:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Voicemail
          description: Whether to enable voicemail detection.
          default: false
        voicemail_detection_duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Voicemail Detection Duration
          description: Time window in seconds to detect voicemail signals.
          default: 30.0
        voicemail_check_interval:
          anyOf:
          - type: number
          - type: 'null'
          title: Voicemail Check Interval
          description: Minimum time in seconds between interim voicemail checks.
          default: 7.0
        voicemail_min_transcript_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Voicemail Min Transcript Length
          description: Minimum number of transcribed words to trigger an interim voicemail
            check.
          default: 7
      type: object
      title: ConversationConfig
    CreateAgentPayload:
      properties:
        agent_config:
          $ref: '#/components/schemas/AgentModel'
          description: The main agent configuration including tools, tasks, and settings.
        agent_prompts:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          title: Agent Prompts
          description: Optional prompts mapped by intent/context.
      type: object
      required:
      - agent_config
      title: CreateAgentPayload
    CreateApiKeyRequest:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        expires_in_days:
          anyOf:
          - type: integer
            maximum: 3650.0
            minimum: 1.0
          - type: 'null'
          title: Expires In Days
      type: object
      required:
      - name
      title: CreateApiKeyRequest
