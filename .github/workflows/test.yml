name: Test

# Required check (spec 0000): mirrors `make check` so CI == local.
on:
  pull_request: {}
  push:
    branches:
      - revamp/**
      - feat/**
      - fix/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check (lint + strict arch lint + mypy + tests + bandit)
        run: make check
