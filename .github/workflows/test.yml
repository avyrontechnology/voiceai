name: Test

# Required check (spec 0000): mirrors `make check` so CI == local. Spec 0048
# (deploy-config): `make setup` (uv, Python 3.10) builds the venv every make
# target runs from; `make check` = lint + lint-arch + type + test + sec.
on:
  pull_request: {}
  push:
    branches:
      - master
      - revamp/**
      - feat/**
      - feature**
      - fix/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.10-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-py3.10-

      - name: Install (make setup = uv venv .venv --python 3.10 + pip install -e '.[dev]')
        run: |
          python -m pip install --upgrade pip uv
          make setup

      - name: Check (lint + strict arch lint + mypy + tests + bandit)
        run: make check
