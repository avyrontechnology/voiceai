name: Modules

# Per-module scope (spec 0019): runs only for PRs touching module sources, one
# job per module plus the dup gate. Native path filters (no external actions);
# the small matrix fan-out (all modules on any modules/ change) is deliberate —
# robust over clever, no untestable bash-to-JSON plumbing.
on:
  pull_request:
    paths:
      - voiceai/modules/**
      - voiceai/common/**
      - voiceai/core/**
      - voiceai/database/**
  push:
    branches:
      - revamp/**
      - feat/**
      - fix/**
    paths:
      - voiceai/modules/**
      - voiceai/common/**
      - voiceai/core/**
      - voiceai/database/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [health, agents, voice, auth, wallet]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Module scope (tests + 85% coverage gate)
        run: make cov-module MODULE=${{ matrix.module }}

  dup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Duplicated-block gate
        run: python voiceai/tooling/dup_blocks.py
