name: Security

# Required check (spec 0000): mirrors `make sec` so CI == local — the bandit that
# `make setup` installs (the `dev` extra lists it unpinned; local runs 1.9.4), same
# scope (ARCH_DIRS + ARCH_EXTRA), same severity/confidence gate. Spec 0048
# (deploy-config): built via `make setup`.
on:
  pull_request: {}
  push:
    branches:
      - master
      - revamp/**
      - feat/**
      - feature**
      - fix/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.10-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-py3.10-

      - name: Install (make setup = uv venv .venv --python 3.10 + pip install -e '.[dev]')
        run: |
          python -m pip install --upgrade pip uv
          make setup

      # Fails the build on medium+ severity, high-confidence findings (exec/eval,
      # pickle, yaml.load, ...). Low-severity style noise is intentionally not gated.
      - name: Bandit SAST (make sec)
        run: make sec
