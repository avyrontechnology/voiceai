name: Security

# Required check (spec 0000): mirrors `make sec` so CI == local.
on:
  pull_request: {}
  push:
    branches:
      - revamp/**
      - feat/**
      - fix/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Install bandit
        run: python -m pip install --upgrade pip 'bandit==1.9.4'

      # Fails the build on medium+ severity, high-confidence findings (exec/eval/compile,
      # pickle, yaml.load, etc.). Low-severity style noise is intentionally not gated.
      # Scope (ARCH_DIRS) matches `make sec` exactly.
      - name: Bandit SAST
        run: bandit -r voiceai/common voiceai/core voiceai/database voiceai/modules --severity-level medium --confidence-level high
