name: Lint

# Required check (spec 0000): mirrors `make lint-arch` + format check so CI == local.
on:
  pull_request: {}
  push:
    branches:
      - revamp/**
      - feat/**
      - fix/**
  workflow_dispatch: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Ruff lint (repo + strict arch profile)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          make lint lint-arch

      - name: Ruff format check
        run: |
          .venv/bin/ruff format --check --diff voiceai/common voiceai/core voiceai/database voiceai/modules tests/arch || ruff format --check --diff voiceai/common voiceai/core voiceai/database voiceai/modules tests/arch

      - name: Requirements lint
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run requirements-txt-fixer --files requirements.txt
