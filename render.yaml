# Render Blueprint — voiceai Talko trunk (free tier for testing).
# Deploy: dashboard.render.com → New → Blueprint → point at this repo.
# The trunk dials through talko-service; the engine reaches it via TALKO_TRUNK_URL.
# NOTE: free services sleep after ~15 min idle (cold start 30-50s).
services:
  - type: web
    name: voiceai-talko-trunk
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn talko_api_server:app --host 0.0.0.0 --port 10000 --app-dir local_setup/telephony_server
    plan: free
    healthCheckPath: /talko/health
    envVars:
      - key: TALKO_API_BASE_URL
        value: https://talko-service.onrender.com/talko-service/v1
      - key: TALKO_API_KEY
        sync: false
      - key: TALKO_AI_DID
        value: "917965263087"
      - key: TALKO_PARTNER_ID
        value: "2"
